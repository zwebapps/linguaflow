# Local development infrastructure.
# Production swaps these out via env vars only — no code changes:
#   DATABASE_URL  -> Supabase Postgres
#   QDRANT_URL    -> Qdrant Cloud
#   REDIS_URL     -> Render Key-Value / Upstash

services:
  db:
    # pgvector image = plain Postgres 16 + the vector extension, so we can run
    # either vector backend locally (see VECTOR_BACKEND in .env).
    image: pgvector/pgvector:pg16
    container_name: linguaflow-db
    environment:
      POSTGRES_USER: linguaflow
      POSTGRES_PASSWORD: linguaflow
      POSTGRES_DB: linguaflow
    ports:
      # Deliberately unusual host ports: this machine already runs other projects'
      # Postgres on 5433 and Redis on 6379, and binding those made this app silently
      # talk to the wrong database. Keep these dedicated to LinguaFlow.
      - "5442:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linguaflow -d linguaflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: linguaflow-qdrant
    ports:
      - "6333:6333"          # REST
      - "6334:6334"          # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linguaflow-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6390:6379"          # see the note on the db service above
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
  qdrant_data:
  redis_data:

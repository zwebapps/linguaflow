[project]
name = "linguaflow-backend"
version = "0.1.0"
description = "LinguaFlow AI backend — FastAPI + LangChain + OpenRouter + Qdrant"
requires-python = ">=3.11"

dependencies = [
  # Web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",

  # Config / validation
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",

  # DB
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "greenlet>=3.1",

  # Auth — bcrypt directly; passlib is unmaintained and breaks on bcrypt 5.x
  "pyjwt>=2.10",
  "bcrypt>=4.2",

  # LLM orchestration (mandated stack)
  "langchain>=0.3.7",
  "langchain-core>=0.3.15",
  "langchain-openai>=0.2.8",       # OpenAI-compatible client → points at OpenRouter
  "langchain-text-splitters>=0.3.2",
  "openai>=1.54",

  # Vector store
  "qdrant-client>=1.12",
  "pgvector>=0.3.6",

  # Document parsing
  "pypdf>=5.1",
  "python-docx>=1.1",
  "ebooklib>=0.18",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "readability-lxml>=0.8.1",
  "feedparser>=6.0.11",
  "youtube-transcript-api>=0.6.3",
  "markdown-it-py>=3.0",

  # MCP — expose our tools as a server, consume external ones as a client
  "mcp>=1.29",

  # PDF conversation export (runtime feature, not a dev tool)
  "reportlab>=4.2",

  # Infra
  "redis>=5.2",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.4",
  "rank-bm25>=0.2.2",             # keyword half of hybrid search
]

[project.optional-dependencies]
# Embeddings come from OpenRouter by default (no download). Install this extra only
# if you want fully-offline local embeddings — it pulls in torch (~2 GB).
local-embeddings = [
  "sentence-transformers>=3.3",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "respx>=0.21",
  # Alembic's autogenerate comparison API is sync-only, so the migration
  # drift test needs a sync driver alongside asyncpg.
  "psycopg2-binary>=2.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes `migrations/versions/*` itself; reformatting machine output to
# satisfy a linter creates diff noise and invites hand-edits to generated files.
# `migrations/env.py` IS ours and stays linted.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# The irregular-verb table is a data table: one verb per line reads far better
# than wrapping each entry across four lines, so long lines are deliberate here.
"app/ai/tools/conjugation.py" = ["E501"]
